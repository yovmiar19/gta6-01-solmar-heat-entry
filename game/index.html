<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLMAR HEAT — Solmar Bay</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1c10; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* --- HUD (step 1: on foot, third person) -------------------------------- */
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; }
  .panel { background: rgba(20, 14, 8, 0.68); border: 1px solid rgba(242, 201, 76, 0.35); border-radius: 8px; padding: 10px 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.45); }
  .label { font-size: 10px; letter-spacing: 0.14em; color: #f2c94c; font-weight: 700; }

  /* Title, top-left. */
  #title-panel { position: absolute; top: 14px; left: 14px; }
  #title-panel .name { font-size: 22px; font-weight: 900; letter-spacing: 0.06em; }
  #title-panel .name .heat { color: #ff8a5c; }
  #title-panel .place { font-size: 12px; color: #ffd97a; letter-spacing: 0.12em; margin-top: 2px; }
  #title-panel .step { font-size: 11px; color: #d8cfc2; margin-top: 4px; }

  /* Clock, top-right. */
  #clock-box { position: absolute; top: 14px; right: 14px; text-align: right; }
  #clock { font-size: 22px; font-weight: 800; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7); }
  #clock-sub { font-size: 11px; letter-spacing: 0.1em; color: #ffd97a; margin-top: 2px; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7); }

  /* On-foot / driving state, bottom-left. */
  #onfoot { position: absolute; left: 14px; bottom: 14px; width: 210px; }
  #move-state { font-size: 16px; font-weight: 800; letter-spacing: 0.08em; margin-top: 2px; }
  #speed-line { font-size: 12px; color: #d8cfc2; margin-top: 4px; }
  #speed-line b { color: #fff; }
  .bar { height: 8px; background: rgba(255, 255, 255, 0.18); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  #pace-bar { height: 100%; background: #f2c94c; width: 0%; border-radius: 4px; }

  /* Action prompt ("Press E to enter the Sunset GT"), above the hint. */
  #car-prompt { position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%); display: none; font-size: 14px; font-weight: 700; color: #ffd97a; background: rgba(20, 14, 8, 0.72); border: 1px solid rgba(242, 201, 76, 0.5); border-radius: 6px; padding: 6px 12px; white-space: nowrap; }
  #car-prompt b { color: #fff; }

  /* Controls hint, bottom-centre. */
  #hint { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); font-size: 12px; color: rgba(255, 255, 255, 0.85); text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85); white-space: nowrap; }
  #hint b { color: #f2c94c; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Heat: Raka walks the streets of Solmar Bay in third person"></canvas>
<p id="status" role="status" aria-live="polite"></p>

<div id="hud">
  <div id="title-panel" class="panel">
    <div class="name">SOLMAR <span class="heat">HEAT</span></div>
    <div class="place">SOLMAR BAY · GOLDEN HOUR</div>
    <div class="step">STEP 2 — ON FOOT + DRIVING</div>
  </div>
  <div id="clock-box">
    <div id="clock">17:30</div>
    <div id="clock-sub">GOLDEN HOUR</div>
  </div>
  <div id="onfoot" class="panel">
    <div class="label" id="mode-label">ON FOOT</div>
    <div id="move-state">IDLE</div>
    <div id="speed-line">Speed <b id="speed-num">0</b> km/h · <span id="speed-what">Raka</span></div>
    <div class="bar"><div id="pace-bar"></div></div>
  </div>
  <div id="car-prompt"></div>
  <div id="hint"><b>WASD</b> move &nbsp;·&nbsp; <b>Shift</b> run &nbsp;·&nbsp; <b>E</b> enter car &nbsp;·&nbsp; <b>drag</b> to look around</div>
</div>

<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
